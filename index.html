<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple API App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        #error-message { color: red; font-weight: bold; }
        #data-container { padding: 15px; border: 1px solid #ccc; display: none; }
    </style>
</head>
<body>

    <h1>api данные</h1>

    <div id="data-container">
        <p><strong>название:</strong> <span id="todo-title">загрузка...</span></p>
    </div>

    <div id="error-message"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const dataContainer = document.getElementById('data-container');
            const errorMessage = document.getElementById('error-message');
            const todoTitle = document.getElementById('todo-title');

            try {
                const response = await fetch('https://typicode.com');

                if (response.status === 403) {
                    errorMessage.textContent = 'ошибка 403';
                    return;
                }

                if (!response.ok) {
                    errorMessage.textContent = `ошибка сервера: ${response.status}`;
                    return;
                }

                const data = await response.json();

                todoTitle.textContent = data.title;
                dataContainer.style.display = 'block';

            } catch (error) {
                errorMessage.textContent = 'ошибка при сетевом запросе';
            }
        });
    </script>
</body>
</html>
